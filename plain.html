<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Video only</title>
  </head>
  <body>
    <div id="app">
      <header class="bar">
        <h1><span data-i18n="app.plainTitle">Video only</span> <span class="tag" data-i18n="app.tag">Prototype</span></h1>
        <p class="note" data-i18n="app.plainNote"></p>

        <div class="viewopts">
          <a class="navlink" href="./basic.html" data-i18n="nav.basic">Guided video</a>
          <a class="navlink" href="./index.html" data-i18n="nav.full">Live analysis</a>
          <label class="field checkbox" data-i18n-title="view.light.title">
            <input type="checkbox" id="toggle-light" />
            <span data-i18n="view.light">Screen light</span>
          </label>
        </div>
      </header>

      <section class="stage solo" id="stage">
        <video id="preview" playsinline muted></video>

        <div class="stage-empty" id="stage-empty">
          <p data-i18n="stage.empty">Camera not started yet.</p>
        </div>

        <div class="prompt" id="prompt" hidden>
          <div class="prompt-step" id="prompt-step"></div>
          <div class="prompt-title" id="prompt-title"></div>
          <div class="prompt-instruction" id="prompt-instruction"></div>
          <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
        </div>

        <div class="hints" id="hints"></div>

        <div class="sidemark left" id="mark-left"></div>
        <div class="sidemark right" id="mark-right"></div>
      </section>

      <footer class="bar controls">
        <button id="btn-start" type="button" data-i18n="btn.start">Start camera</button>
        <button id="btn-guide" type="button" hidden data-i18n="btn.guide">Start guidance</button>
        <button id="btn-clip" type="button" hidden data-i18n="btn.run">Start recording</button>
        <button id="btn-repeat" type="button" class="ghost" hidden data-i18n="btn.repeatPlain">Repeat position</button>
        <button id="btn-abort" type="button" class="ghost" hidden data-i18n="btn.abort">Stop</button>
        <button id="btn-export" type="button" hidden data-i18n="btn.export">Save as ZIP</button>
        <button id="btn-again" type="button" class="ghost" hidden data-i18n="btn.again">New recording</button>
        <button id="btn-settings" type="button" class="ghost" data-i18n="settings.open">Settings</button>

        <span class="status" id="status"></span>
      </footer>

      <dialog id="settings" class="sheet">
        <h2 data-i18n="settings.title">Settings</h2>
        <div class="sheet-fields">
          <label class="field">
            <span data-i18n="app.language">Language</span>
            <select id="locale-select"></select>
          </label>
          <label class="field">
            <span data-i18n="field.camera">Camera</span>
            <select id="camera-select" disabled></select>
          </label>
          <label class="field" data-i18n-title="plain.size.title">
            <span data-i18n="basic.size">Video size</span>
            <select id="size-select">
              <option value="720">720</option>
              <option value="1080" selected>1080</option>
              <option value="1440">1440</option>
              <option value="1920">1920</option>
              <option value="0" data-i18n="plain.sizeMax">Maximum</option>
            </select>
          </label>
          <label class="field" data-i18n-title="announce.mode.title">
            <span data-i18n="announce.mode">Announcements</span>
            <select id="announce-select">
              <option value="verbose" data-i18n="announce.verbose">Detailed</option>
              <option value="brief" data-i18n="announce.brief">Brief</option>
              <option value="tones" data-i18n="announce.tones">Tones only</option>
            </select>
          </label>
        </div>
        <button id="btn-settings-close" type="button" class="ghost" data-i18n="settings.close">Close</button>
      </dialog>
    </div>

    <script type="module" src="/src/plain/main.ts"></script>
  </body>
</html>
